<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#27272A" stroke-width="1" opacity="0.3">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Badge Top -->
  <g transform="translate(100, 90)">
    <rect width="320" height="40" rx="20" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <circle cx="24" cy="20" r="6" fill="#10B981"/>
    <text x="42" y="25" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="1">CIVIC PROTOCOL &middot; ZERO SERVER</text>
  </g>

  <!-- Title Brand -->
  <text x="100" y="240" fill="#FFFFFF" font-family="Georgia, serif" font-size="92" font-weight="700" letter-spacing="-2">
    COMPILALO
  </text>

  <!-- Subtitle -->
  <text x="100" y="320" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="34" font-weight="400">
    Compilazione e Firma Documenti sul Tuo Dispositivo
  </text>

  <!-- Highlights Pills -->
  <g transform="translate(100, 390)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="230" height="54" rx="8" fill="#1E1E24" stroke="#3F3F46" stroke-width="1"/>
    <text x="24" y="34" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="600">€0,00 Gratuito al 100%</text>
    
    <!-- Pill 2 -->
    <rect x="250" y="0" width="240" height="54" rx="8" fill="#1E1E24" stroke="#3F3F46" stroke-width="1"/>
    <text x="274" y="34" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="600">32 Modelli Pubblica Amm.</text>
    
    <!-- Pill 3 -->
    <rect x="510" y="0" width="220" height="54" rx="8" fill="#1E1E24" stroke="#3F3F46" stroke-width="1"/>
    <text x="534" y="34" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="600">Zero Cookie &middot; No Cloud</text>

    <!-- Pill 4 -->
    <rect x="750" y="0" width="230" height="54" rx="8" fill="#1E1E24" stroke="#3F3F46" stroke-width="1"/>
    <text x="774" y="34" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="600">Firma Grafica Istantanea</text>
  </g>

  <!-- Footer Brand Line -->
  <g transform="translate(100, 530)">
    <line x1="0" y1="0" x2="1000" y2="0" stroke="#27272A" stroke-width="1"/>
    <text x="0" y="40" fill="#71717A" font-family="ui-monospace, monospace" font-size="16">
      AUTOCERTIFICAZIONI DPR 445/2000 &middot; RICORSI MULTE &middot; DISDETTE BERSANI &middot; DELEGHE
    </text>
    <text x="920" y="40" fill="#60A5FA" font-family="ui-monospace, monospace" font-size="16" font-weight="bold">
      compilalo.it
    </text>
  </g>
</svg>
